name: Bing Daily Picture

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:  # 允许在 GitHub 网页手动触发

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 workflow 自动提交图片到仓库

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 下载 Bing 每日壁纸
        run: python main.py

      - name: 提交并推送图片到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bing_Picture/
          git commit -m "Update Bing daily picture $(TZ='Asia/Shanghai' date '+%Y-%m-%d')" || echo "没有新图片需要提交"
          git push
